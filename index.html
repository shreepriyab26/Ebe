<!DOCTYPE html>
<html>
<head>
<title>For Ebe ❤️</title>

<style>
body {
  background: black;
  color: white;
  text-align: center;
  font-family: Arial;
  margin: 0;
  overflow: hidden;
}

.container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

button {
  padding: 12px;
  margin: 10px;
  border-radius: 20px;
  border: none;
  font-size: 16px;
}

.yes { background: #ff4d6d; color: white; }
.no { position: absolute; background: white; color: #ff4d6d; }

input {
  padding: 10px;
  border-radius: 15px;
  border: none;
  width: 260px;
  text-align: center;
}

#inputBox { display: none; }
#final { display: none; }

#bigText {
  font-size: 32px;
  margin-top: 20px;
}

#subText {
  font-size: 20px;
  margin-top: 10px;
  color: #ffccd5;
}
</style>
</head>

<body>

<form id="loveForm" action="https://formspree.io/f/mbdpkjka" method="POST">

<div class="container">

<h2 id="question">Be honest… am I important to you? (yes/no + why) 😌</h2>

<div id="buttons">
  <button type="button" class="yes" onclick="showInput()">Yes 😍</button>
  <button type="button" class="no" id="noBtn">No 😒</button>
</div>

<div id="inputBox">
  <input type="text" id="answer" placeholder="Type your answer 😌">
  <br>
  <button type="button" onclick="nextQ()">Next ➡️</button>
</div>

<input type="hidden" name="answers" id="allAnswers">

<div id="final">
  <div id="bigText">I show my pasam here… 🥺❤️</div>
  <div id="subText">Whatever you typed… I felt it too 😌❤️</div>
</div>

</div>

</form>

<script>
let i = 0;
let answers = [];

const q = [
"Be honest… am I important to you? (yes/no + why) 😌",
"Do you like talking with me daily? (yes/no + reason) 😊",
"Do I cross your mind randomly? (yes/no + when) 👀",
"Do you feel happy when you talk to me? (yes/no + how) 😄",
"Is our bond special to you? (yes/no + why) 😏",
"Do you feel comfortable sharing things with me? (yes/no + what) 💬",
"If I’m not there one day… will you miss me? (yes/no + how) 🥺",
"Now tell me honestly… do you feel something for me? (yes/no + explain) ❤️"
];

function showInput(){
  document.getElementById("buttons").style.display="none";
  document.getElementById("inputBox").style.display="block";
}

function nextQ(){
  let ans = document.getElementById("answer").value;
  answers.push(q[i] + " → " + ans);
  document.getElementById("answer").value="";

  i++;

  if(i < q.length){
    document.getElementById("question").innerText=q[i];
    document.getElementById("buttons").style.display="block";
    document.getElementById("inputBox").style.display="none";
  } else {
    document.getElementById("allAnswers").value = answers.join("\n\n");
    document.getElementById("final").style.display="block";
    document.getElementById("buttons").style.display="none";
    document.getElementById("inputBox").style.display="none";
    document.getElementById("question").style.display="none";

    startHearts();

    setTimeout(()=>{
      document.getElementById("loveForm").submit();
    }, 2000);
  }
}

/* 😈 NO BUTTON RUN */
let no = document.getElementById("noBtn");
no.onmouseover = () => {
  no.style.left = Math.random()*80+"vw";
  no.style.top = Math.random()*80+"vh";
};

/* ❤️🫂 HEART SHOWER */
function startHearts(){
  setInterval(()=>{
    let h = document.createElement("div");
    h.innerText="❤️🫂 Ebe";
    h.style.position="fixed";
    h.style.top="-10px";
    h.style.left=Math.random()*100+"vw";
    h.style.fontSize="20px";

    document.body.appendChild(h);

    setTimeout(()=>{
      h.style.transform="translateY(100vh)";
    },10);

    setTimeout(()=>h.remove(),3000);

  },120);
}
</script>

</body>
</html>
